# Netlify build configuration — SOS Patto (Eleventy)

[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  NODE_ENV = "production"

# ── FAVICON ──
[[redirects]]
  from = "/favicon.ico"
  to = "/IMAGES/favicon-32x32.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/IMAGES/apple-touch-icon.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon-precomposed.png"
  to = "/IMAGES/apple-touch-icon.png"
  status = 200

# ── SCHEDE ACCORPATE ──
# Il reclamo R.G. 8694/2026 (Trib. Palermo) aveva due schede, cautelare e merito:
# ora sono una sola, datata alla decisione definitiva.
[[redirects]]
  from = "/giurisprudenza/trib-palermo-8694-2026-06-29.html"
  to = "/giurisprudenza/trib-palermo-8694-2026-07-25.html"
  status = 301

# Idem per il reclamo gemello R.G. 8695/2026: la scheda del decreto cautelare
# (27.06.2026) e' stata accorpata nella scheda dell'ordinanza definitiva.
[[redirects]]
  from = "/giurisprudenza/trib-palermo-8695-2026-06-27.html"
  to = "/giurisprudenza/trib-palermo-8695-2026-07-25.html"
  status = 301

# ── SCHEDE RIMOSSE ──
# L'ordinanza istruttoria del T.A.R. Lombardia sulla class action pubblica
# (ord. 3818/2026) e' stata tolta dal sito: l'URL pubblicato rimanda all'indice.
[[redirects]]
  from = "/giurisprudenza/tar-lombardia-3818-2026-07-20.html"
  to = "/giurisprudenza.html"
  status = 301

# Decreto cautelare Trib. Torino del 14 settembre 2026 (giud. Aragno): regime pre-Patto,
# tolto dal sito (resta nella KB). Il PDF non è più in public/.
[[redirects]]
  from = "/giurisprudenza/trib-torino-aragno-2026-09-14.html"
  to = "/giurisprudenza.html"
  status = 301

[[redirects]]
  from = "/en/giurisprudenza/trib-torino-aragno-2026-09-14.html"
  to = "/en/giurisprudenza.html"
  status = 301

[[redirects]]
  from = "/fr/giurisprudenza/trib-torino-aragno-2026-09-14.html"
  to = "/fr/giurisprudenza.html"
  status = 301

[[redirects]]
  from = "/allegati/giurisprudenza/trib-torino-aragno-2026-09-14.pdf"
  to = "/giurisprudenza.html"
  status = 301

# ── HOMEPAGE CANONICAL ──
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# ── SECURITY HEADERS ──
# Nota: X-Frame-Options SAMEORIGIN (non DENY) perche' il diagramma
# e' incorporato via iframe dalla pagina /diagramma.html
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ── ASSET CACHING ──
# CSS/JS del sito hanno ?v=<hash> nel link -> cache lunga sicura
[[headers]]
  for = "/src/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/src/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/IMAGES/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400, stale-while-revalidate=604800"

# I testi interattivi vengono aggiornati in blocco: cache breve
[[headers]]
  for = "/patto-interattivo/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# ── ATTI NORMATIVI FUORI DALLE CIRCOLARI ──
# Decreti-legge, d.lgs. e leggi stanno solo in «Normativa italiana», come testo interattivo:
# le vecchie schede in /circolari/ rimandano al testo (v. REDAZIONE.md, § 7).
[[redirects]]
  from = "/circolari/dl-100-2026.html"
  to = "/patto-interattivo/dl-100-2026/index.html"
  status = 301

[[redirects]]
  from = "/circolari/dl-168-2026.html"
  to = "/patto-interattivo/dl-168-2026/index.html"
  status = 301

[[redirects]]
  from = "/en/circolari/dl-100-2026.html"
  to = "/patto-interattivo/dl-100-2026/index.html"
  status = 301

[[redirects]]
  from = "/en/circolari/dl-168-2026.html"
  to = "/patto-interattivo/dl-168-2026/index.html"
  status = 301

[[redirects]]
  from = "/fr/circolari/dl-100-2026.html"
  to = "/patto-interattivo/dl-100-2026/index.html"
  status = 301

[[redirects]]
  from = "/fr/circolari/dl-168-2026.html"
  to = "/patto-interattivo/dl-168-2026/index.html"
  status = 301

